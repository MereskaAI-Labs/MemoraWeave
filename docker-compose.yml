services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: memoraweave_postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow123
      POSTGRES_DB: memoraweave_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d memoraweave_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: postgres:15
    container_name: memoraweave_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow123
      POSTGRES_DB: memoraweave_db
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./app/db/sql:/migrations:ro
      - ./app/db/run_migrations.sh:/run_migrations.sh:ro
    entrypoint: ["/bin/sh", "/run_migrations.sh"]
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4
    container_name: memoraweave_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    entrypoint: /bin/sh -c "echo 'memoraweave_postgres:5432:*:mlflow:mlflow123' > /tmp/pgpass && chmod 600 /tmp/pgpass && /entrypoint.sh"
    volumes:
      - ./.docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
